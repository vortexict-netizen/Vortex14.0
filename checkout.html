<!doctype html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout | Vortex 14.0</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Orbitron:wght@400;500;700;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

    <!-- Link your base CSS files -->
    <link rel="stylesheet" href="./css/index.css" />
    <link rel="stylesheet" href="./css/checkout.css" />
    
    <!-- Link the index cursor and animations -->
    <link rel="stylesheet" href="./css/fx.css" />
    
    <style>
      /* Generous click hitboxes for all interactive elements */
      .icon-btn, .submit-btn, select, label { position: relative; }
      .icon-btn::after, .submit-btn::after {
        content: ""; position: absolute; top: -12px; right: -12px; bottom: -12px; left: -12px;
      }

      /* Payment QR Styling */
      .payment-qr-box {
        background: var(--btn-wrapper-bg);
        border: 1px solid var(--glass-border);
        border-radius: 12px;
        padding: 1.2rem;
        margin: 1.5rem 0;
        text-align: center;
      }
      .payment-qr-box img {
        max-width: 180px;
        width: 100%;
        border-radius: 10px;
        border: 2px solid var(--primary-cyan);
        padding: 6px;
        background: #fff;
        margin: 0.8rem auto;
        display: block;
      }
    </style>

    <script src="./scripts/fx.js" defer></script>
    <script src="https://www.google.com/recaptcha/api.js?render=6LcIgeAtAAAAAJuakH7S9z9eNDTFvsW7ilxBkxYf"></script>
</head>
<body>

    <nav class="navbar">
        <a href="index.html" class="nav-logo">
            <img src="photos/vortex_L.png" alt="Vortex 14.0" class="logo-light" />
            <img src="photos/vortex_D.png" alt="Vortex 14.0" class="logo-dark" />
        </a>
        <div class="nav-controls">
            <button class="icon-btn" id="themeToggleBtn" aria-label="Toggle Theme">
                <i class="fa-solid fa-sun" id="themeIcon"></i>
            </button>
        </div>
    </nav>

    <!-- Background Animations -->
    <div class="ambient-bg" aria-hidden="true">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="electrons-container">
            <div class="electron e-1"></div>
            <div class="electron e-2"></div>
            <div class="electron e-3"></div>
        </div>
    </div>

    <!-- The fx.js file targets this specific div for the cursor -->
    <div id="glowing-cursor"></div>

    <main class="checkout-container">
        <div class="checkout-grid">
            
            <div class="checkout-form-section">
                <h2 class="font-heading" style="margin-bottom: 1.5rem;">Participant <span class="gradient-text">Details</span></h2>
                
                <form id="checkoutForm">
                    <div class="form-group">
                        <label for="fullName">Full Name</label>
                        <input type="text" id="fullName" class="form-control" placeholder="John Doe" minlength="3" required>
                    </div>

                    <div class="form-group">
                        <label for="phone">Phone Number</label>
                        <input type="tel" id="phone" class="form-control" placeholder="10-digit mobile number" pattern="[6-9][0-9]{9}" title="Enter a valid 10-digit Indian mobile number" maxlength="10" required>
                    </div>

                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" class="form-control" placeholder="john@example.com" required>
                    </div>

                    <div class="form-group">
                        <label for="collegeSelect">College Name</label>
                        <select id="collegeSelect" class="form-control form-select" required>
                            <option value="" disabled selected>Select your institute...</option>
                            <option value="Institute of Chemical Technology (ICT), Mumbai">Institute of Chemical Technology (ICT), Mumbai</option>
                            <option value="Veermata Jijabai Technological Institute (VJTI)">Veermata Jijabai Technological Institute (VJTI)</option>
                            <option value="Other">Other...</option>
                        </select>
                    </div>

                    <div class="form-group" id="otherCollegeGroup" style="display: none;">
                        <label for="otherCollege">Enter College Name</label>
                        <input type="text" id="otherCollege" class="form-control" placeholder="Type your college name..." minlength="3">
                    </div>

                    <!-- Year of Study -->
                    <div class="form-group">
                        <label for="yearSelect">Year of Study</label>
                        <select id="yearSelect" class="form-control form-select" required>
                            <option value="" disabled selected>Select your year...</option>
                            <option value="First Year (FY)">First Year (FY)</option>
                            <option value="Second Year (SY)">Second Year (SY)</option>
                            <option value="Third Year (TY)">Third Year (TY)</option>
                            <option value="Final Year (B.Tech/BE)">Final Year (B.Tech/BE)</option>
                            <option value="Postgraduate (Masters)">Postgraduate (Masters)</option>
                            <option value="PhD / Research Scholar">PhD / Research Scholar</option>
                        </select>
                    </div>

                    <!-- College ID / Roll Number -->
                    <div class="form-group">
                        <label for="collegeId">College ID / Roll Number</label>
                        <input type="text" id="collegeId" class="form-control" placeholder="e.g., 21CE1005" required>
                    </div>

                    <!-- QR Code & Manual Payment Section -->
                    <div class="payment-qr-box">
                        <h4 class="font-heading" style="font-size: 0.95rem; color: var(--primary-cyan);">Scan & Pay Total Amount</h4>
                        <p style="font-size: 0.82rem; color: var(--text-muted); margin-top: 4px;">
                            Pay the exact <strong>Total Payable</strong> shown in your Order Summary via any UPI app.
                        </p>
                        <!-- Replace photos/payment_qr.png with your actual QR code image path -->
                        <img src="photos/payment_qr.png" alt="UPI Payment QR Code" onerror="this.style.display='none'" />
                    </div>

                    <!-- UPI Transaction ID / UTR -->
                    <div class="form-group">
                        <label for="transactionId">UPI Transaction ID / 12-Digit UTR Number</label>
                        <input type="text" id="transactionId" class="form-control" placeholder="e.g., 432189654123" minlength="6" required>
                    </div>

                    <!-- Payment Screenshot / PDF Upload -->
                    <div class="form-group">
                        <div class="hoop-upload-header">
                            <label for="paymentProof" style="margin: 0;">Upload Payment Screenshot or Receipt (Image / PDF, Max 3MB)</label>
                            <span class="hoop-badge" id="hoopUploadBadge">Uploaded 0</span>
                        </div>

                        <div class="hoop-dropzone" id="hoopDropzone">
                            <i class="fa-solid fa-arrow-up-from-bracket hoop-upload-icon"></i>
                            <div class="hoop-title">Drop files here</div>
                            <div class="hoop-sub">or take the shot (PNG, JPG, PDF)</div>

                            <!-- Animated File Icon -->
                            <div class="flying-file-doc" id="flyingFileDoc" data-ext="PDF"></div>

                            <!-- Backboard, Rim & Net SVG -->
                            <div class="hoop-svg-wrap" aria-hidden="true">
                                <svg viewBox="0 0 130 95" fill="none" xmlns="http://www.w3.org/2000/svg">
                                    <!-- Backboard -->
                                    <rect x="28" y="4" width="74" height="40" rx="5" stroke="var(--primary-cyan)" stroke-width="2" fill="rgba(0,243,255,0.06)"/>
                                    <rect x="47" y="18" width="36" height="20" rx="2" stroke="var(--primary-purple)" stroke-width="1.5"/>
                                    <!-- Rim -->
                                    <ellipse cx="65" cy="48" rx="34" ry="4.5" stroke="#ff6b35" stroke-width="3.5" fill="none"/>
                                    <!-- Net -->
                                    <g class="hoop-net" stroke="var(--text-muted)" stroke-width="1.3">
                                        <path d="M34 50 L44 90 M46 52 L53 90 M58 52 L61 90 M72 52 L69 90 M84 52 L77 90 M96 50 L86 90"/>
                                        <path d="M36 58 L94 58 M39 70 L91 70 M42 82 L88 82" stroke-dasharray="4 3"/>
                                        <path d="M34 50 L53 90 M46 52 L69 90 M58 52 L86 90 M96 50 L77 90 M84 52 L61 90 M72 52 L44 90" opacity="0.6"/>
                                    </g>
                                </svg>
                            </div>

                            <input type="file" id="paymentProof" accept="image/png, image/jpeg, image/jpg, image/webp, application/pdf" required>
                        </div>

                        <div id="fileUploadName" class="file-upload-name"></div>
                    </div>

                    <div style="margin: 20px 0; display: flex; gap: 10px; align-items: flex-start;">
                        <input type="checkbox" id="termsConsent" name="termsConsent" required style="margin-top: 4px;">
                        <label for="termsConsent" style="font-size: 0.9rem; color: #aaa; line-height: 1.4;">
                            I agree to the <a href="terms.html" target="_blank" style="color: var(--primary-cyan);">Terms & Conditions</a> and consent to Vortex 14.0 collecting my details for registration, event updates, and certificate generation.
                        </label>
                    </div>

                    <button type="submit" class="submit-btn" id="proceedBtn">Submit Registration</button>
                </form>
                
            </div>

            <div class="checkout-summary-section">
                <h3 class="font-heading" style="font-size: 1.2rem; margin-bottom: 1.5rem; border-bottom: 1px solid var(--glass-border); padding-bottom: 10px;">Order Summary</h3>
                
                <div id="checkoutEventList" class="checkout-events"></div>

                <div class="summary-totals">
                    <div class="summary-row">
                        <span>Subtotal</span>
                        <span id="checkoutSubtotal">₹0</span>
                    </div>
                    <div class="summary-row discount">
                        <span id="checkoutDiscountLabel">Discount (0%)</span>
                        <span id="checkoutDiscount">-₹0</span>
                    </div>
                    <div class="summary-row total">
                        <span>Total Payable</span>
                        <span id="checkoutTotal" style="font-size: 1.5rem; color: var(--primary-cyan);">₹0</span>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <script type="module" src="./scripts/checkout.js"></script>
</body>
</html>
